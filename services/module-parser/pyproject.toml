[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coc-module-parser"
version = "0.1.0"
description = "CoC 7e module parsing sidecar for coc-room"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "coc-room contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.4,<2",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
coc-module-parser = "coc_module_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coc_module_parser"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["coc_module_parser"]
