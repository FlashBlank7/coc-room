name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      relay_url:
        description: Public relay HTTPS origin to bake into the Windows artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coc-room/protocol build
      - run: pnpm check
      - run: pnpm test
      - name: Live two-session forced-relay smoke
        shell: bash
        run: |
          pnpm --filter @coc-room/relay exec wrangler dev --port 8787 >"$RUNNER_TEMP/relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/relay.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/health >/dev/null || {
            cat "$RUNNER_TEMP/relay.log"
            exit 1
          }
          COC_ROOM_LIVE_RELAY_URL=http://127.0.0.1:8787 \
            pnpm --filter @coc-room/desktop smoke:relay-session
      - run: pnpm build

  python:
    name: Python parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/module-parser
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: services/module-parser/uv.lock
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run pytest

  windows-nsis:
    name: Windows x64 sidecar and NSIS
    needs: [typescript, python]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.PUBLIC_RELAY_URL || 'http://127.0.0.1:8787' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: services/module-parser/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build Python sidecar
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File services/module-parser/scripts/build.ps1
      - name: Place sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item services/module-parser/dist/coc-module-parser-x86_64-pc-windows-msvc.exe apps/desktop/src-tauri/binaries/module-parser-x86_64-pc-windows-msvc.exe -Force
      - name: Smoke-test frozen sidecar
        run: pnpm smoke:sidecar
      - name: Check and test Rust bridge
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - run: pnpm --filter @coc-room/protocol build
      - name: Build Tauri NSIS installer
        run: pnpm --filter @coc-room/desktop tauri build --target x86_64-pc-windows-msvc
      - name: Real WebView2 direct, forced-relay, storage, export, and sidecar smoke
        shell: pwsh
        run: |
          $pnpm = (Get-Command pnpm).Source
          $relayOut = Join-Path $env:RUNNER_TEMP "relay-webview-smoke.out.log"
          $relayErr = Join-Path $env:RUNNER_TEMP "relay-webview-smoke.err.log"
          $relay = Start-Process -FilePath $pnpm `
            -ArgumentList @("--filter", "@coc-room/relay", "exec", "wrangler", "dev", "--port", "8787") `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $relayOut `
            -RedirectStandardError $relayErr `
            -WindowStyle Hidden `
            -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              if ($relay.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8787/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Get-Content -LiteralPath $relayOut -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $relayErr -ErrorAction SilentlyContinue
              throw "Local relay did not become ready"
            }

            $app = Get-ChildItem -Path apps/desktop/src-tauri/target -Filter "coc-room.exe" -File -Recurse |
              Where-Object { $_.FullName -notmatch "[\\/]bundle[\\/]" } |
              Select-Object -First 1
            if (-not $app) { throw "Built desktop executable was not found" }

            foreach ($mode in @("direct", "relay", "storage")) {
              $env:COC_ROOM_NETWORK_SMOKE = "1"
              $env:COC_ROOM_NETWORK_SMOKE_URL = "http://127.0.0.1:8787"
              $env:COC_ROOM_NETWORK_SMOKE_MODE = $mode
              if ($mode -ne "storage") {
                Remove-Item Env:COC_ROOM_NETWORK_SMOKE_EXPORT_DIR -ErrorAction SilentlyContinue
                $runId = [guid]::NewGuid().ToString("N")
                $runDirectory = Join-Path $env:RUNNER_TEMP "network-$mode-$runId"
                New-Item -ItemType Directory -Path $runDirectory | Out-Null
                $coordinationPath = Join-Path $runDirectory "rendezvous.json"
                $hostResultPath = Join-Path $runDirectory "host.json"
                $playerResultPath = Join-Path $runDirectory "player.json"
                $hostProcess = $null
                $playerProcess = $null
                try {
                  $env:COC_ROOM_NETWORK_SMOKE_COORDINATION = $coordinationPath
                  $env:COC_ROOM_NETWORK_SMOKE_RUN_ID = $runId
                  $env:COC_ROOM_NETWORK_SMOKE_ROLE = "host"
                  $env:COC_ROOM_NETWORK_SMOKE_RESULT = $hostResultPath
                  $hostProcess = Start-Process -FilePath $app.FullName -WindowStyle Hidden -PassThru

                  foreach ($attempt in 1..120) {
                    if (Test-Path -LiteralPath $coordinationPath -PathType Leaf) { break }
                    if ($hostProcess.HasExited) { throw "Desktop $mode host exited before publishing rendezvous" }
                    Start-Sleep -Milliseconds 250
                  }
                  if (-not (Test-Path -LiteralPath $coordinationPath -PathType Leaf)) {
                    throw "Desktop $mode host did not publish rendezvous within 30 seconds"
                  }

                  $env:COC_ROOM_NETWORK_SMOKE_ROLE = "player"
                  $env:COC_ROOM_NETWORK_SMOKE_RESULT = $playerResultPath
                  $playerProcess = Start-Process -FilePath $app.FullName -WindowStyle Hidden -PassThru
                  if ($hostProcess.Id -eq $playerProcess.Id) { throw "Network smoke did not launch distinct processes" }

                  foreach ($attempt in 1..180) {
                    if ((Test-Path -LiteralPath $hostResultPath) -and (Test-Path -LiteralPath $playerResultPath)) { break }
                    if ($hostProcess.HasExited -and -not (Test-Path -LiteralPath $hostResultPath)) {
                      throw "Desktop $mode host exited before reporting"
                    }
                    if ($playerProcess.HasExited -and -not (Test-Path -LiteralPath $playerResultPath)) {
                      throw "Desktop $mode player exited before reporting"
                    }
                    Start-Sleep -Milliseconds 500
                  }
                  if (-not (Test-Path -LiteralPath $hostResultPath) -or -not (Test-Path -LiteralPath $playerResultPath)) {
                    throw "Two-process desktop $mode smoke did not report within 90 seconds"
                  }

                  foreach ($expected in @(
                    @{ Role = "host"; Path = $hostResultPath },
                    @{ Role = "player"; Path = $playerResultPath }
                  )) {
                    $report = Get-Content -LiteralPath $expected.Path -Raw | ConvertFrom-Json
                    if (-not $report.ok) { throw "Desktop $mode $($expected.Role) failed: $($report.message)" }
                    if ($report.details.role -ne $expected.Role -or $report.details.mode -ne $mode) {
                      throw "Desktop $mode report role or mode does not match its process"
                    }
                    if ($report.details.runId -ne $runId) { throw "Desktop $mode report escaped its run ID" }
                    if ($report.details.path -ne $mode) { throw "Desktop $mode used $($report.details.path) instead" }
                    if ($report.details.outgoingPayloadBytes -le 65536 -or $report.details.incomingPayloadBytes -le 65536) {
                      throw "Desktop $mode did not exchange large payloads in both directions"
                    }
                    if (-not $report.details.bidirectionalAcknowledgements) {
                      throw "Desktop $mode did not verify bidirectional receipt"
                    }
                  }
                } finally {
                  if ($playerProcess -and -not $playerProcess.HasExited) { Stop-Process -Id $playerProcess.Id -Force }
                  if ($hostProcess -and -not $hostProcess.HasExited) { Stop-Process -Id $hostProcess.Id -Force }
                  foreach ($path in @($coordinationPath, $hostResultPath, $playerResultPath)) {
                    if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
                  }
                  if (Test-Path -LiteralPath $runDirectory) { Remove-Item -LiteralPath $runDirectory -Force }
                  Remove-Item Env:COC_ROOM_NETWORK_SMOKE_COORDINATION -ErrorAction SilentlyContinue
                  Remove-Item Env:COC_ROOM_NETWORK_SMOKE_RUN_ID -ErrorAction SilentlyContinue
                  Remove-Item Env:COC_ROOM_NETWORK_SMOKE_ROLE -ErrorAction SilentlyContinue
                }
                continue
              }

              $resultPath = Join-Path $env:RUNNER_TEMP "network-storage-$([guid]::NewGuid().ToString('N')).json"
              $env:COC_ROOM_NETWORK_SMOKE_RESULT = $resultPath
              $storageExportDir = Join-Path $env:RUNNER_TEMP "storage-smoke-$([guid]::NewGuid().ToString('N'))"
              New-Item -ItemType Directory -Path $storageExportDir | Out-Null
              $env:COC_ROOM_NETWORK_SMOKE_EXPORT_DIR = $storageExportDir
              $process = Start-Process -FilePath $app.FullName -WindowStyle Hidden -PassThru
              try {
                foreach ($attempt in 1..240) {
                  if (Test-Path -LiteralPath $resultPath) { break }
                  if ($process.HasExited) { throw "Desktop storage smoke exited before reporting" }
                  Start-Sleep -Milliseconds 500
                }
                if (-not (Test-Path -LiteralPath $resultPath)) { throw "Desktop storage smoke did not report within 120 seconds" }
                $report = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
                if (-not $report.ok) { throw "Desktop storage smoke failed: $($report.message)" }
                if (-not $report.details.cleanupVerified) { throw "Storage smoke did not verify room cleanup" }
                if ($report.details.persistedEvents -ne 1 -or $report.details.lastSeq -ne 1) {
                  throw "Storage smoke persistence counters are invalid"
                }
                if (-not $report.details.duplicateWasIdempotent) { throw "Storage smoke did not verify duplicate-event idempotency" }
                if ($report.details.sidecarProvider -ne "mock" -or $report.details.sidecarTitle -ne "存储冒烟模组 🦋") {
                  throw "Storage smoke did not verify the packaged mock sidecar"
                }
                if ($report.details.markdownFile -ne "transcript.md" -or $report.details.htmlFile -ne "transcript.html") {
                  throw "Storage smoke returned unexpected export file names"
                }
                $markdownPath = Join-Path $storageExportDir "transcript.md"
                $htmlPath = Join-Path $storageExportDir "transcript.html"
                if (-not (Test-Path -LiteralPath $markdownPath -PathType Leaf)) { throw "Markdown export was not created" }
                if (-not (Test-Path -LiteralPath $htmlPath -PathType Leaf)) { throw "HTML export was not created" }
                $markdownBytes = [IO.File]::ReadAllBytes($markdownPath)
                $htmlBytes = [IO.File]::ReadAllBytes($htmlPath)
                if ($markdownBytes.Length -ne $report.details.markdownBytes) { throw "Markdown export size differs from report" }
                if ($htmlBytes.Length -ne $report.details.htmlBytes) { throw "HTML export size differs from report" }
                $markdown = [Text.Encoding]::UTF8.GetString($markdownBytes)
                $html = [Text.Encoding]::UTF8.GetString($htmlBytes)
                if (-not $markdown.Contains([string]$report.details.marker)) { throw "Markdown export lost the stored event" }
                if (-not $html.Contains([string]$report.details.marker)) { throw "HTML export lost the stored event" }
                if (-not $html.StartsWith("<!doctype html>") -or $html -match "(?i)<script\b") {
                  throw "HTML export is not a script-free self-contained document"
                }
              } finally {
                if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              }
            }
          } finally {
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_URL -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_MODE -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_RESULT -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_EXPORT_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_COORDINATION -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_RUN_ID -ErrorAction SilentlyContinue
            Remove-Item Env:COC_ROOM_NETWORK_SMOKE_ROLE -ErrorAction SilentlyContinue
            if (-not $relay.HasExited) { Stop-Process -Id $relay.Id -Force }
          }
      - name: Install and launch NSIS smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/src-tauri/target -Filter "*.exe" -Recurse |
            Where-Object { $_.FullName -match "[\\/]bundle[\\/]nsis[\\/]" } |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not found" }

          $installDir = Join-Path $env:RUNNER_TEMP "coc-room-nsis-smoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install exited with $($install.ExitCode)" }

          $appNames = @("coc-room.exe", "密斯卡托尼克终端.exe")
          $app = Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -File -Recurse |
            Where-Object { $appNames -contains $_.Name } |
            Select-Object -First 1
          if (-not $app) {
            $installedExecutables = (Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -File -Recurse).Name -join ", "
            throw "Installed desktop executable was not found; found: $installedExecutables"
          }

          $process = Start-Process -FilePath $app.FullName -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed desktop app exited during startup" }
          Stop-Process -Id $process.Id -Force

          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -match "uninstall" } |
            Select-Object -First 1
          if (-not $uninstaller) { throw "NSIS uninstaller was not found" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall exited with $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: coc-room-windows-x64-nsis
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
